name: AlbumUnlock
options:
  bundleIdPrefix: com.shasteel.helper
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  AlbumUnlock:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shasteel.helper.albumunlock
        # 可执行文件名保持 ASCII（利于 Windows 端 Sideloadly 重签）；桌面显示名用 Info.plist 的中文
        PRODUCT_NAME: AlbumUnlock
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        # 版本号：每次构建都要递增。
        # 当前 4.18 (38) —— 地址栏空位上10/下30；以后每改一版 MARKETING_VERSION +0.1、CURRENT_PROJECT_VERSION +1
        CURRENT_PROJECT_VERSION: "38"
        MARKETING_VERSION: "4.18"
